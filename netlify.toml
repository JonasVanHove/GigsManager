# ─────────────────────────────────────────────────────────────────────────────
# Netlify build configuration for GigsManager (Next.js 14 + Prisma)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Critical build order:
  # 1. npm ci with dev deps (includes Prisma CLI and @prisma/client)
  # 2. prisma migrate deploy — applies pending migrations BEFORE the build, so
  #    a deploy never ships code that queries columns the database lacks.
  #    Needs DATABASE_URL (and DIRECT_URL) available at build time; both are
  #    configured as Netlify environment variables.
  #    `migrate deploy` never prompts and never resets data, so it is safe to
  #    run on every build. Note it deliberately does NOT run `prisma generate`:
  #    that comes next, after the schema is current.
  # 3. Explicit prisma generate (ensure client is generated)
  # 4. npm run build (Next.js build bundles everything correctly)
  # postinstall will also run prisma generate as redundant safety net
  command   = "npm ci --include=dev && npx prisma migrate deploy && npm run db:generate && npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION                  = "20"
  NODE_ENV                      = "production"
  # Prisma query engine: use "library" for serverless (not "binary")
  # This ensures Prisma uses the libquery_engine-*.so.node binary for Netlify Lambda
  PRISMA_CLI_QUERY_ENGINE_TYPE  = "library"
  # Ensure Prisma generates with correct binary target
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING = "true"
  # Git clone settings
  GIT_LFS_ENABLED               = "false"
  # Suppress false positive: NEXT_PUBLIC_* vars are intentionally public
  SECRETS_SCAN_OMIT_KEYS        = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL"

# ⚠️  RUNTIME ENVIRONMENT VARIABLES (set in Netlify Dashboard UI)
# These MUST be configured in Site Settings → Build & Deploy → Environment:
# 
# DATABASE_URL
#   - Your PostgreSQL connection string with transaction pooler
#   - Format: postgresql://user:password@host:6543/database?pgbouncer=true
#   - Source: Supabase Dashboard → Settings → Database → Connection Pooling → Transaction pooler
#
# DIRECT_URL
#   - Direct database connection for migrations (without pooler)
#   - Format: postgresql://user:password@host:5432/database
#   - Source: Supabase Dashboard → Settings → Database → Connection Pooling → Session pooler
#
# NEXT_PUBLIC_SUPABASE_URL
#   - Your Supabase project URL
#   - Source: Supabase Dashboard → Settings → General → Project URL
#
# NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - Supabase anonymous key (safe to expose)
#   - Source: Supabase Dashboard → Settings → API → anon key
#
# SUPABASE_SERVICE_ROLE_KEY
#   - Supabase service role (SECRET - never expose)
#   - Source: Supabase Dashboard → Settings → API → service_role key
#
# If any of these are missing, API routes will fail with 500 errors.

# ─── Next.js Runtime Plugin ──────────────────────────────────────────────────

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Headers ─────────────────────────────────────────────────────────────────

# Static assets with long-term caching
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js public folder assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts with long-term caching
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images with moderate caching
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Icons with long caching
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest and browserconfig
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/browserconfig.xml"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type  = "application/xml"

# Service worker should always revalidate to avoid stale SW logic on clients
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

# API routes with shorter caching
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    X-Content-Type-Options       = "nosniff"
    Cache-Control                = "public, max-age=60, s-maxage=3600"

# HTML pages with revalidation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options    = "DENY"
    X-XSS-Protection   = "1; mode=block"
    Referrer-Policy     = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Cache-Control      = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' fonts.googleapis.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'"

# ─── Redirects ───────────────────────────────────────────────────────────────
# SPA fallback handled automatically by @netlify/plugin-nextjs
